<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行囊工坊 · PackLab</title><link rel="stylesheet" href="/style.css"><script>try{if(localStorage.getItem('packlab-view')==='quiet'){document.documentElement.dataset.view='quiet';document.title='运行时调试台 · 本地沙箱';}}catch{}</script></head>
<body><header><a id="brand" class="brand" href="#">H▧GAME <span>/ 003</span></a><nav><button id="view">调试台模式</button><button id="help">操作说明</button><button id="new">新的一局</button></nav></header>
<main><section class="intro"><div><p class="eyebrow" id="eyebrow">SMALL SPACE. BIG POSSIBILITIES.</p><h1 id="title">行囊工坊</h1><p id="subtitle">把每一格，变成战力。</p></div><div class="run-meta"><span id="seed"></span><b id="floor"></b></div></section>
<section class="status"><div><span id="hpLabel">生命</span><b id="hp"></b><progress id="hpBar" max="40" value="40"></progress></div><div><span id="goldLabel">金币</span><b id="gold"></b></div><div><span id="energyLabel">体力</span><b id="energy"></b></div><div><span id="blockLabel">护甲</span><b id="block"></b></div></section>
<div class="layout"><section class="workspace"><section class="panel bag-panel"><div class="section-heading"><div><span class="kicker" id="bagKicker">YOUR BUILD</span><h2 id="bagTitle">背包布局</h2></div><span id="capacity"></span></div><p class="hint" id="bagHint"></p><div id="grid" class="grid" aria-label="背包布局"></div><div class="grid-footer"><span id="gridNote"></span><button id="placeSelected">自动寻找空位</button></div></section>

<section class="panel stash-panel"><div class="section-heading"><h2 id="stashTitle">行囊外仓库</h2><span id="stashCount"></span></div><p id="stashHint" class="hint"></p><div id="inventory" class="inventory"></div></section></section>
<aside><section class="panel inspector"><div class="section-heading"><h2 id="detailTitle">物品详情</h2><span id="itemKind"></span></div><div id="detail"></div><div class="item-actions"><button id="activate" class="primary">使用物品</button><button id="endTurnQuick">结束回合 →</button><button id="rotate">旋转 90°</button><button id="stash">移回仓库</button><button id="sell">出售</button></div></section><section class="panel encounter"><div class="section-heading"><span class="kicker" id="phase"></span><b id="turn"></b></div><div class="enemy-mark" id="enemyMark">◇</div><h2 id="enemyName"></h2><div id="enemyVitals"></div><div class="intent" id="intent"></div><p class="hint" id="battleHint"></p><button id="start" class="primary wide">进入战斗 →</button><button id="endTurn" class="primary wide">结束回合 →</button></section>
<section class="panel" id="camp" hidden><div class="section-heading"><h2 id="rewardTitle">战利品 · 三选一</h2><button id="skip">跳过 +3 金币</button></div><div id="rewards" class="offers"></div><div class="section-heading shop-heading"><h2 id="shopTitle">路边商店</h2><button id="rest">休整 $4</button></div><div id="offers" class="offers"></div></section>
<section class="panel ending" id="ending" hidden><p class="kicker" id="endKicker"></p><h2 id="endTitle"></h2><p id="endText"></p><button id="restart">重新开始</button></section>
<section class="panel journal"><div class="section-heading"><h2 id="logTitle">行动记录</h2><span>LOCAL</span></div><ol id="log"></ol></section></aside></div><p id="notice" role="status" aria-live="polite"></p><footer><span id="footer">PackLab · 离线单人 · 原创规则与界面</span><span>自动保存 · Alt+M</span></footer></main>
<dialog id="helpDialog"><h2>PackLab · 操作说明</h2><div id="helpContent"></div><button id="closeHelp" class="primary">知道了</button></dialog>
<dialog id="newDialog"><h2 id="newTitle">新的一局</h2><p id="newHint">确认后覆盖当前自动存档。</p><label id="seedLabel" for="seedInput">种子编号（留空随机）</label><input id="seedInput" maxlength="24" placeholder="例如 PACK-001" autocomplete="off"><p id="seedError" role="status"></p><div class="dialog-actions"><button id="cancelNew">保留当前进度</button><button id="confirmNew" class="primary">确认新建</button></div></dialog>
<script type="module" src="/app.js"></script></body></html>
