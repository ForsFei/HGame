<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸牌工坊 · HGame</title><script>try{if(localStorage.getItem('cardlab-view')==='quiet'){document.documentElement.dataset.view='quiet';document.title='组合分析 · 本地工作台';}}catch{}</script><link rel="stylesheet" href="/style.css"></head><body>
<header><div id="brand">H▧GAME <span>/ 002</span></div><nav><button id="recordsButton">本地战绩</button><button id="view" title="Alt+M 切换视图">简洁模式</button><button id="help">玩法说明</button><button id="new">新的一局</button></nav></header>
<main><section class="intro"><div><div class="eyebrow" id="eyebrow">THE ART OF A GOOD HAND</div><h1 id="title">纸牌工坊 <em>CardLab</em></h1><p id="subtitle">让一手好牌，变成一整套好策略。</p></div><div class="run-tag" id="runTag">单人构筑 / 8 阶段</div></section>
<div class="layout"><section class="workspace"><section class="stage-panel"><div class="stage-heading"><span id="stage"></span><b id="phase"></b></div><div class="score-line"><div><small id="scoreLabel">本关得分</small><strong id="score">0</strong></div><div class="target"><small id="targetLabel">目标</small><b id="target"></b></div></div><progress id="progress" value="0" max="150"></progress><div class="resources"><span id="hands"></span><span id="discards"></span><span id="deck"></span><b id="money"></b></div></section>
<div class="seed-bar"><span id="seedLabel"></span><button id="replayCurrent">同种子重开</button></div><div id="stageRule" class="stage-rule"></div><section class="modules-panel"><div class="section-heading"><h2 id="moduleTitle">效果模块</h2><span id="slots">0 / 5</span></div><div id="modules"></div></section>
<section class="play-area" id="playArea"><div class="section-heading"><h2 id="handTitle">你的手牌</h2><div class="sort"><button id="sortRank">按点数</button><button id="sortSuit">按花色</button></div></div><div id="cards" class="cards"></div><div class="preview" id="preview"></div><div class="actions"><button id="play" class="primary">出牌</button><button id="discard">弃牌</button><button id="clear" class="text-button">取消选择</button><span id="selectedCount">选择 1–5 张</span></div></section>
<section class="shop" id="shop" hidden><div class="section-heading"><h2 id="shopTitle">关间商店</h2><button id="reroll">刷新 $3</button></div><p id="shopHint"></p><div id="offers" class="offers"></div><div id="upgrades" class="upgrades"></div><button id="next" class="primary">进入下一关 →</button></section>
<section id="ending" class="ending" hidden><div class="eyebrow">SESSION COMPLETE</div><h2 id="endingTitle"></h2><p id="endingText"></p><button id="restart" class="primary">再开一局</button></section>
<div id="notice" class="notice" role="status" aria-live="polite"></div><div id="last" class="last"></div></section>
<aside><section class="reference"><div class="section-heading"><h2 id="referenceTitle">牌型手册</h2><span id="levelLabel">筹码 × 倍率</span></div><div id="reference"></div><p id="scoringHint"></p></section><section class="journal"><h2 id="journalTitle">通关记录</h2><div id="journal"></div></section></aside></div>
<footer><span id="footer">HGame · 原创效果与界面 · 离线单人</span><span>自动存档 · Alt+M</span></footer></main>
<dialog id="helpDialog"><h2 id="helpTitle"></h2><div id="helpContent"></div><button id="closeHelp" class="primary">明白了</button></dialog>
<dialog id="newDialog"><h2 id="newTitle">开启新的一局？</h2><p id="newHint">将覆盖当前自动存档。</p><label for="seedInput" id="seedInputLabel">种子编号（留空随机）</label><input id="seedInput" maxlength="24" autocomplete="off" placeholder="例如 CARDLAB-001"><p id="seedError" role="status"></p><div class="actions"><button id="cancelNew">继续当前进度</button><button id="confirmNew" class="primary">确认新建</button></div></dialog>
<dialog id="recordsDialog"><h2 id="recordsTitle">本地战绩</h2><p id="recordSummary"></p><div id="recordList"></div><button id="closeRecords">关闭</button></dialog>
<script type="module" src="/app.js"></script></body></html>
