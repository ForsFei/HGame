<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词条校验 · HGame</title><link rel="icon" href="data:,"><script>try{if(localStorage.getItem('wordcheck-view')==='quiet'){document.documentElement.dataset.view='quiet';document.title='构建日志 · 本地';}}catch{}</script><link rel="stylesheet" href="./style.css"></head>
<body>
<header><a class="brand" id="brand" href="#">H▧GAME <span>/ 004</span></a><nav><button id="dailyButton">每日挑战</button><button id="recordsButton">本地战绩</button><button id="view" title="切换简洁模式（Alt+M）">简洁模式</button><button id="help">玩法说明</button><button id="newGame">新的一局</button></nav></header>
<main>
<section class="intro"><div><p class="eyebrow" id="eyebrow">SIX TRIES. FIVE LETTERS.</p><h1 id="title">词条校验</h1><p id="subtitle">六次机会，读出一个五位的词条。</p></div><div class="run-meta"><span id="modeTag"></span><b id="fieldTag"></b><span id="triesTag"></span></div></section>
<section class="daily" id="daily"><div><b id="dailyTitle">每日挑战</b><p id="dailyHint"></p></div><div class="daily-actions"><button id="dailyPlay" class="primary">开始今日</button><button id="dailyRecords">今日战绩</button></div></section>
<div class="layout"><section class="workspace">
 <section class="board-panel"><div class="board-head"><span id="boardTitle">尝试记录</span><span id="boardHint"></span></div><div id="board" class="board" role="grid" aria-label="尝试记录"></div><p id="notice" class="notice" role="status" aria-live="polite"></p></section>
 <section class="keyboard-panel"><div id="keyboard" class="keyboard"></div><p class="keyboard-hint" id="keyboardHint"></p></section>
 <section class="result" id="result" hidden><div class="result-head"><h2 id="resultTitle"></h2><span id="resultTag"></span></div><p id="resultText"></p><p id="answerLine"></p><div class="result-actions"><button id="again" class="primary">再来一局</button><button id="copy">复制结果</button></div></section>
</section>
<aside>
 <section class="panel legend-panel"><div class="section-heading"><h2 id="legendTitle">怎么读反馈</h2><span id="legendTag">5 × 6</span></div><div id="legend" class="legend"></div><p id="legendHint" class="hint"></p></section>
 <section class="panel stats-panel"><div class="section-heading"><h2 id="statsTitle">本地统计</h2><span id="statsTag"></span></div><div class="stat-grid"><div><small id="statDoneLabel">完成</small><b id="statDone">0</b></div><div><small id="statRateLabel">通过率</small><b id="statRate">—</b></div><div><small id="statStreakLabel">连续通过</small><b id="statStreak">0</b></div></div><div id="dist" class="dist"></div></section>
 <section class="panel pool-panel"><div class="section-heading"><h2 id="poolTitle">词域</h2><span id="poolTag"></span></div><div id="pool" class="pool"></div><p id="poolHint" class="hint"></p></section>
</aside></div>
<footer><span id="footer">词条校验 · 离线单人 · 原创规则与界面</span><span id="footerTag">自动保存 · Alt+M</span></footer>
</main>
<dialog id="helpDialog"><h2 id="helpTitle">玩法说明</h2><div id="helpContent"></div><button id="closeHelp" class="primary">明白了</button></dialog>
<dialog id="recordsDialog"><h2 id="recordsTitle">本地战绩</h2><p id="recordsSummary"></p><div id="recordsList"></div><button id="closeRecords" class="primary">关闭</button></dialog>
<dialog id="newDialog"><h2 id="newTitle">开始新的一局？</h2><p id="newHint">将覆盖当前自动存档。</p><p id="newError" role="status"></p><div class="dialog-actions"><button id="cancelNew">继续当前进度</button><button id="confirmNew" class="primary">确认新建</button></div></dialog>
<script type="module" src="./app.js"></script></body></html>
