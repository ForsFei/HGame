<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>告警复位 · HGame</title><link rel="icon" href="data:,"><script>try{if(localStorage.getItem('outagereset-view')==='quiet'){document.documentElement.dataset.view='quiet';document.title='告警清零 · 本地';}}catch{}</script><link rel="stylesheet" href="/shared/quiet.css"><link rel="stylesheet" href="./style.css"></head>
<body>
<header><a class="brand" id="brand" href="#">H▧GAME <span>/ 009</span></a><nav><button id="view" title="切换简洁模式（Alt+M）">简洁模式</button><button id="help">玩法说明</button><button id="newGame">新的一局</button></nav></header>
<main>
<section class="intro"><div><p class="eyebrow" id="eyebrow">ALERT. FLIP. CLEAR.</p><h1 id="title">告警复位</h1><p id="subtitle">点一盏灯会连带翻转上下左右，把所有告警熄掉。</p></div><div class="readout"><div><small id="alertsLabel">剩余告警</small><b id="alerts">0</b></div><div><small id="movesLabel">步数</small><b id="moves">0</b></div><div><small id="timerLabel">用时</small><b id="timer">00:00</b></div></div></section>
<p id="notice" class="notice" role="status" aria-live="polite"></p>
<div class="layout"><section class="panel board-panel"><div id="board" class="board" role="grid" aria-label="告警灯盘"></div><div class="result" id="result" hidden><div><h2 id="resultTitle"></h2><p id="resultText"></p></div><button id="next" class="primary">再来一局</button></div></section>
<aside>
 <section class="panel"><div class="section-heading"><h2 id="levelTitle">棋盘规模</h2><span id="levelTag">LEVEL</span></div><div id="levels" class="levels"></div><button id="retry" class="wide">重来本局</button><p id="levelHint" class="hint"></p></section>
 <section class="panel"><div class="section-heading"><h2 id="recordsTitle">最佳成绩</h2><span id="recordsTag">BEST</span></div><div id="records" class="records"></div><p class="hint" id="recordsHint"></p></section>
 <section class="panel"><div class="section-heading"><h2 id="hintTitle">怎么熄灯</h2><span id="hintTag">RULE</span></div><div id="legend" class="legend"></div><p id="hintText" class="hint"></p></section>
</aside></div>
<footer><span id="footer">告警复位 · 离线单人 · 原创规则与界面</span><span id="footerTag">自动保存 · Alt+M</span></footer>
</main>
<dialog id="helpDialog"><h2 id="helpTitle">玩法说明</h2><div id="helpContent"></div><button id="closeHelp" class="primary">明白了</button></dialog>
<dialog id="newDialog"><h2 id="newTitle">开始新的一局？</h2><p id="newHint">当前进度会被覆盖。</p><div class="dialog-actions"><button id="cancelNew">继续当前进度</button><button id="confirmNew" class="primary">确认新建</button></div></dialog>
<script type="module" src="./app.js"></script></body></html>
