<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>异常点排查 · HGame</title><link rel="icon" href="data:,"><script>try{if(localStorage.getItem('nodesweep-view')==='quiet'){document.documentElement.dataset.view='quiet';document.title='巡检日志 · 本地';}}catch{}</script><link rel="stylesheet" href="/shared/quiet.css"><link rel="stylesheet" href="./style.css"></head>
<body>
<header><a class="brand" id="brand" href="#">H▧GAME <span>/ 007</span></a><nav><button id="view" title="切换简洁模式（Alt+M）">简洁模式</button><button id="help">玩法说明</button><button id="newGame">新的一局</button></nav></header>
<main>
<section class="intro"><div><p class="eyebrow" id="eyebrow">SCAN. FLAG. ISOLATE.</p><h1 id="title">异常点排查</h1><p id="subtitle">逐个排查节点，标出异常，别踩中它。</p></div><div class="readout"><div><small id="flagsLabel">剩余标记</small><b id="flags">10</b></div><div><small id="timerLabel">用时</small><b id="timer">00:00</b></div></div></section>
<p id="notice" class="notice" role="status" aria-live="polite"></p>
<div class="layout"><section class="panel board-panel"><div id="board" class="board" role="grid" aria-label="排查棋盘"></div><div class="result" id="result" hidden><div><h2 id="resultTitle"></h2><p id="resultText"></p></div><button id="next" class="primary">再来一局</button></div></section>
<aside>
 <section class="panel"><div class="section-heading"><h2 id="levelTitle">排查范围</h2><span id="levelTag">LEVEL</span></div><div id="levels" class="levels"></div><div id="daily" class="daily"><div><small id="dailyLabel">今日范围</small><b id="dailyLevel">—</b></div><div><small id="dailyBestLabel">今日最佳</small><b id="dailyBest">—</b></div><button id="dailyStart" class="daily-start">开始今日一局</button></div><p id="levelHint" class="hint"></p></section>
 <section class="panel"><div class="section-heading"><h2 id="recordsTitle">最佳用时</h2><span id="recordsTag"></span></div><div id="records" class="records"></div></section>
 <section class="panel"><div class="section-heading"><h2 id="hintTitle">怎么读格子</h2><span id="hintTag">RULE</span></div><div id="legend" class="legend"></div><p id="hintText" class="hint"></p></section>
</aside></div>
<footer><span id="footer">异常点排查 · 离线单人 · 原创规则与界面</span><span id="footerTag">自动保存 · Alt+M</span></footer>
</main>
<dialog id="helpDialog"><h2 id="helpTitle">玩法说明</h2><div id="helpContent"></div><button id="closeHelp" class="primary">明白了</button></dialog>
<dialog id="newDialog"><h2 id="newTitle">开始新的一局？</h2><p id="newHint">当前进度会被覆盖。</p><div class="dialog-actions"><button id="cancelNew">继续当前进度</button><button id="confirmNew" class="primary">确认新建</button></div></dialog>
<script type="module" src="./app.js"></script></body></html>
